<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Date Planner</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode">
  <div id="floating-bg" class="floating-bg" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="navbar glass-card">
      <div class="nav-brand">
        <span class="brand-title">Our Date Planner</span>
      </div>
      <div class="nav-actions">
        <div id="user-badge" class="user-badge hidden">
          <span class="user-icon" aria-hidden="true">
            <svg class="ui-icon ui-icon-sm" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </span>
          <span id="user-name-display"></span>
        </div>
        <button id="btn-logout" class="btn btn-secondary btn-sm hidden">
          Log Out
        </button>
      </div>
    </header>

    <main class="main-content">
      <section id="login-section" class="glass-card login-card">
        <div class="card-header text-center">
          <div class="section-icon-wrap" aria-hidden="true">
            <svg class="ui-icon ui-icon-lg" viewBox="0 0 24 24">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </div>
          <h1 class="display-title">Private Space</h1>
          <p class="subtitle">Please log in to manage our date plans</p>
        </div>

        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" class="input-field" placeholder="Enter username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="input-field" placeholder="Enter password" autocomplete="current-password" required>
          </div>
          <div id="login-error" class="error-banner hidden" role="alert"></div>
          <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block">
            <span>Enter Planner</span>
            <svg class="ui-icon ui-icon-sm" viewBox="0 0 24 24">
              <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
            </svg>
          </button>
        </form>
      </section>

      <section id="app-section" class="app-views hidden">
        <div class="glass-card roll-hero-card text-center">
          <h2 class="display-title">What should we do?</h2>
          <div class="hero-sparkle" aria-hidden="true">
            <svg class="ui-icon ui-icon-hero" viewBox="0 0 24 24">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 9c-.83 0-1.5-.67-1.5-1.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm0 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5-4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5S15.67 6 16.5 6s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
          </div>

          <button type="button" id="btn-roll-date" class="btn btn-roll">
            <span>Roll a Date Plan!</span>
          </button>

          <div id="roll-result-card" class="roll-result-card hidden" aria-live="polite">
            <div class="result-badge">Today's Adventure</div>
            <h3 id="rolled-title" class="rolled-title"></h3>
            <p id="rolled-creator" class="rolled-subtitle"></p>
            <button type="button" id="btn-quick-release" class="btn btn-secondary btn-sm mt-3">
              Release from waitlist now
            </button>
          </div>
        </div>

        <div class="glass-card add-card">
          <h2 class="section-title">
            <svg class="ui-icon" viewBox="0 0 24 24">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
            <span>Add a New Date Idea</span>
          </h2>
          <form id="add-date-form" class="add-form">
            <div class="form-group">
              <label for="new-date-title">Date Plan</label>
              <input type="text" id="new-date-title" class="input-field" placeholder="e.g. Stargazing picnic with strawberries..." required>
            </div>
            <button type="submit" id="btn-add-submit" class="btn btn-primary">
              <svg class="ui-icon ui-icon-sm" viewBox="0 0 24 24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
              </svg>
              <span>Add to Plans</span>
            </button>
          </form>
        </div>

        <div class="lists-grid">
          <div class="glass-card list-card">
            <div class="list-card-header">
              <h3 class="card-title">
                <span>Available Dates</span>
                <span id="available-count" class="count-badge">0</span>
              </h3>
            </div>
            <div id="available-dates-list" class="items-list" role="region" aria-label="Available dates">
              <p class="empty-state">No date plans available yet. Add some above!</p>
            </div>
          </div>

          <div class="glass-card list-card">
            <div class="list-card-header">
              <h3 class="card-title">
                <span>Waitlist</span>
                <span id="cooldown-count" class="count-badge badge-cooldown">0</span>
              </h3>
            </div>
            <div id="cooldown-dates-list" class="items-list" role="region" aria-label="Dates on cooldown">
              <p class="empty-state">No dates on cooldown right now.</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
